<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1280" height="680" fill="#FFFFFF"/>

  <!-- Servicios de sesión de Mojang -->
  <rect x="660" y="20" width="250" height="56" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="5 4"/>
  <text x="785" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Servicios de sesión de Mojang</text>
  <text x="785" y="63" text-anchor="middle" font-size="12" fill="#475569">verifican la cuenta del jugador</text>

  <!-- Cliente -->
  <rect x="30" y="222" width="190" height="154" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
  <text x="125" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Cliente</text>
  <text x="125" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Minecraft 26.1</text>
  <text x="125" y="314" text-anchor="middle" font-size="12" fill="#475569">cuenta autenticada</text>
  <text x="125" y="331" text-anchor="middle" font-size="12" fill="#475569">o cliente atacante</text>

  <!-- Servidor vanilla -->
  <rect x="1060" y="222" width="190" height="154" rx="10" fill="#F1F5F9" stroke="#334155" stroke-width="1.5"/>
  <text x="1155" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Servidor vanilla</text>
  <text x="1155" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">26.1</text>
  <text x="1155" y="314" text-anchor="middle" font-size="12" fill="#475569">127.0.0.1:25566</text>
  <text x="1155" y="331" text-anchor="middle" font-size="12" fill="#475569">online-mode=false</text>

  <!-- Proxy -->
  <rect x="330" y="100" width="600" height="460" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="360" y="128" font-size="16" font-weight="700" fill="#312E81">Proxy defensivo · Node.js · 127.0.0.1:25565</text>

  <line x1="785" y1="76" x2="785" y2="142" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flecha-gris)"/>
  <text x="795" y="96" font-size="11.5" fill="#64748B">solo al conectar</text>

  <!-- Login -->
  <rect x="360" y="144" width="540" height="40" rx="6" fill="#FFFFFF" stroke="#6366F1"/>
  <text x="630" y="169" text-anchor="middle" font-size="12.5" fill="#1E1B4B"><tspan font-weight="600">Login</tspan> · autentica con Mojang y entra al backend con el UUID offline del nombre</text>

  <!-- Carril clientbound -->
  <text x="360" y="210" font-size="11.5" font-weight="600" fill="#4338CA" letter-spacing="0.5">CLIENTBOUND · SERVIDOR → CLIENTE</text>
  <rect x="360" y="220" width="540" height="54" rx="6" fill="#FFFFFF" stroke="#6366F1"/>
  <text x="630" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1B4B">Reenvío de bytes originales, sin reglas</text>
  <text x="630" y="261" text-anchor="middle" font-size="11.5" fill="#475569">position, respawn y login reinician la referencia de movimiento</text>

  <!-- Carril serverbound -->
  <text x="360" y="300" font-size="11.5" font-weight="600" fill="#4338CA" letter-spacing="0.5">SERVERBOUND · CLIENTE → SERVIDOR · ESTADO PLAY</text>
  <rect x="360" y="310" width="160" height="66" rx="6" fill="#FFFFFF" stroke="#6366F1"/>
  <text x="440" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1B4B">1 · Interpretar</text>
  <text x="440" y="356" text-anchor="middle" font-size="11.5" fill="#475569">sobre una copia</text>

  <rect x="550" y="310" width="160" height="66" rx="6" fill="#FFFFFF" stroke="#6366F1"/>
  <text x="630" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1B4B">2 · Reglas de contenido</text>
  <text x="630" y="356" text-anchor="middle" font-size="11.5" fill="#475569">rules.mjs</text>

  <rect x="740" y="310" width="160" height="66" rx="6" fill="#FFFFFF" stroke="#6366F1"/>
  <text x="820" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1B4B">3 · Reenviar</text>
  <text x="820" y="356" text-anchor="middle" font-size="11.5" fill="#475569">bytes originales</text>

  <rect x="740" y="402" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#6366F1"/>
  <text x="820" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1B4B">4 · Tasa por segundo</text>
  <text x="820" y="444" text-anchor="middle" font-size="11.5" fill="#475569">ids.mjs</text>

  <!-- record() -->
  <rect x="550" y="486" width="350" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="725" y="509" text-anchor="middle" font-size="13" font-weight="600" fill="#78350F">record() · punto único de registro</text>
  <text x="725" y="528" text-anchor="middle" font-size="11.5" fill="#92400E">observe: registra · enforce: registra y desconecta</text>

  <!-- Flechas internas -->
  <line x1="520" y1="343" x2="548" y2="343" stroke="#334155" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="710" y1="343" x2="738" y2="343" stroke="#334155" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="820" y1="376" x2="820" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="630" y1="376" x2="630" y2="484" stroke="#D97706" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="638" y="434" font-size="11.5" fill="#92400E">alertas</text>
  <line x1="820" y1="458" x2="820" y2="484" stroke="#D97706" stroke-width="1.5" marker-end="url(#flecha)"/>
  <line x1="695" y1="274" x2="695" y2="308" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#flecha-gris)"/>

  <!-- Flujos externos -->
  <line x1="220" y1="343" x2="358" y2="343" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="900" y1="343" x2="1058" y2="343" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="1060" y1="247" x2="902" y2="247" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="360" y1="247" x2="222" y2="247" stroke="#334155" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="275" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">TCP cifrado</text>
  <text x="275" y="306" text-anchor="middle" font-size="11.5" fill="#475569">puerto 25565</text>
  <text x="995" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">TCP sin cifrar</text>
  <text x="995" y="306" text-anchor="middle" font-size="11.5" fill="#475569">loopback · 25566</text>

  <!-- Desconexión en enforce -->
  <polyline points="550,514 125,514 125,378" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flecha-roja)"/>
  <text x="360" y="506" font-size="11.5" font-weight="600" fill="#B91C1C">enforce: corta la sesión</text>

  <!-- Registro JSONL -->
  <line x1="725" y1="542" x2="725" y2="598" stroke="#059669" stroke-width="1.5" marker-end="url(#flecha)"/>
  <rect x="615" y="600" width="220" height="56" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="725" y="623" text-anchor="middle" font-size="13" font-weight="600" fill="#064E3B">packets.jsonl</text>
  <text x="725" y="642" text-anchor="middle" font-size="11.5" fill="#047857">un evento por línea, sin contenido</text>

  <!-- Acceso directo al backend -->
  <rect x="1060" y="470" width="190" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-dasharray="5 4"/>
  <text x="1155" y="493" text-anchor="middle" font-size="13" font-weight="600" fill="#7F1D1D">Otro proceso local</text>
  <text x="1155" y="512" text-anchor="middle" font-size="11.5" fill="#991B1B">sin pasar por el proxy</text>
  <line x1="1155" y1="470" x2="1155" y2="378" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flecha-roja)"/>
  <text x="1155" y="548" text-anchor="middle" font-size="11.5" fill="#B91C1C">el IDS no ve esta conexión</text>
</svg>
